name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm run typecheck

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Build development extension
        if: matrix.node-version == '20.x'
        run: pnpm run build

      - name: Build release extension
        if: matrix.node-version == '22.x'
        run: pnpm run build:release

      - name: Verify generated WebMCP sources
        run: pnpm run check:generated

      - name: Setup Chrome for Testing
        if: matrix.node-version == '22.x'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run read-page browser tests
        if: matrix.node-version == '22.x'
        run: pnpm run test:browser:built
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Run built MV3 extension browser tests
        if: matrix.node-version == '22.x'
        run: pnpm run test:browser:mv3:built
        env:
          CHROME_FOR_TESTING_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      # Optional: Upload build artifacts for debugging
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7
